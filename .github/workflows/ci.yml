name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI runs for pull requests from forks of this public
# repository and needs nothing but read access to its contents (#13).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Install scripts are skipped for the same reason scripts/setup.mjs skips
      # them: sharp's install script can fall back to compiling libvips from
      # source and roll back the whole install. Nothing in this job needs
      # Puppeteer's Chromium, which is the only script-driven step the project
      # actually depends on.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
